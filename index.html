<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .form-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
    }

    .form-card h2 {
      margin-bottom: 8px;
      font-size: 24px;
      color: #111827;
    }

    .form-card p {
      margin-bottom: 24px;
      font-size: 14px;
      color: #6b7280;
    }

    /* Form Layout */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Honeypot Field (Anti-Spam) */
    .gotcha-field {
      display: none !important;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .submit-btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Notification Status Messages */
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      display: block;
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .status-msg.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Get in Touch</h2>
    <p>Fill out the form below to send a message directly to our inbox.</p>

    <!-- Formspree HTML Form -->
    <form id="my-form" action="https://formspree.io/f/xwvgqgdr" method="POST">
      
      <!-- Anti-Spam Honeypot Field -->
      <input type="text" name="_gotcha" class="gotcha-field" tabindex="-1" autocomplete="off">

      <!-- Full Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <!-- Sender Email Address (Maps Reply-To in Zoho) -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="_replyto" placeholder="john@example.com" required>
      </div>

      <!-- Subject Line -->
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="_subject" placeholder="Inquiry about services" required>
      </div>

      <!-- Message Body -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="submit-btn">Send Message</button>

      <!-- AJAX Feedback Container -->
      <div id="status-message" class="status-msg"></div>

    </form>
  </div>

  <!-- JavaScript to handle submission without leaving page -->
  <script>
    const form = document.getElementById("my-form");
    const statusMsg = document.getElementById("status-message");
    const submitBtn = document.getElementById("submit-btn");

    async function handleSubmit(event) {
      event.preventDefault();
      
      // Update button state while sending
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";
      statusMsg.className = "status-msg";
      statusMsg.style.display = "none";

      const data = new FormData(event.target);
      
      try {
        const response = await fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: {
              'Accept': 'application/json'
          }
        });

        if (response.ok) {
          statusMsg.innerText = "Thank you! Your message has been sent to our Zoho Mail.";
          statusMsg.classList.add("success");
          form.reset();
        } else {
          const result = await response.json();
          if (Object.hasOwn(result, 'errors')) {
            statusMsg.innerText = result["errors"].map(error => error["message"]).join(", ");
          } else {
            statusMsg.innerText = "Oops! There was a problem submitting your form.";
          }
          statusMsg.classList.add("error");
        }
      } catch (error) {
        statusMsg.innerText = "Oops! Network error. Please try again later.";
        statusMsg.classList.add("error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Message";
      }
    }

    form.addEventListener("submit", handleSubmit);
  </script>

</body>
</html>
